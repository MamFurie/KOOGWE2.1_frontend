name: koogwe
description: Application de transport premium KOOGWE - Amérique du Sud
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation
  go_router: ^13.0.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Network
  dio: ^5.4.0
  
  # WebSocket Socket.io pour le temps réel
  socket_io_client: ^2.0.3+1
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  
  # Animations
  lottie: ^3.1.0
  shimmer: ^3.0.0
  
  # OTP / Phone
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png